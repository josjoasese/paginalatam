<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATAM Travel Assistance - Reserva de Vuelos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;font-family:"Inter",sans-serif;margin:0;padding:0;}
body{background:#f9f9f9;color:#1b1b1b;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;}
header{background:#003b71;color:white;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
header h1{font-weight:700;font-size:24px;}
nav a{margin-left:20px;font-weight:500;transition:.3s;}
nav a:hover{opacity:.8;}
.hero{background:url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat;color:white;padding:80px 20px;text-align:center;position:relative;}
.hero::after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);}
.hero h2{position:relative;font-size:36px;margin-bottom:20px;z-index:1;}
.search-form{background:white;max-width:1100px;margin:0 auto;padding:25px;border-radius:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;box-shadow:0 8px 25px rgba(0,0,0,0.15);}
.search-form input,.search-form select,.search-form button{padding:12px;border-radius:8px;border:1px solid #ccc;font-size:16px;}
.toggle-btn{background:#f1f1f1;border:none;font-weight:600;padding:10px;border-radius:8px;transition:.3s;}
.toggle-btn.active{background:#d7001c;color:white;}
.search-btn-container{grid-column:1/-1;text-align:center;}
.search-form button{background:#003b71;color:white;border:none;font-weight:600;transition:.3s;}
.search-form button:hover{background:#d7001c;}
.autocomplete-suggestions{position:absolute;top:50px;left:0;right:0;background:white;border:1px solid #ccc;border-radius:8px;max-height:180px;overflow-y:auto;z-index:10;}
.autocomplete-suggestions div{padding:8px;cursor:pointer;}
.autocomplete-suggestions div:hover{background:#f2f2f2;}
#results-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:20;animation:fadeIn .3s;}
#results-modal .modal-content{background:white;padding:30px;border-radius:12px;max-width:900px;width:95%;max-height:85%;overflow-y:auto;position:relative;animation:slideIn .3s;box-shadow:0 8px 25px rgba(0,0,0,.25);}
#results-modal .close{position:absolute;top:15px;right:20px;cursor:pointer;font-size:28px;font-weight:700;color:#d7001c;}
#results-list table{width:100%;border-collapse:collapse;margin-top:20px;font-size:14px;}
#results-list th,#results-list td{padding:12px;border-bottom:1px solid #ddd;text-align:center;}
#results-list th{background:#003b71;color:white;cursor:pointer;}
#results-list tr:hover{background:#f9f9f9;transition:.2s;}
.reserve-btn{background:#003b71;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;transition:.3s;font-weight:600;}
.reserve-btn:hover{background:#d7001c;}
#trip-summary{margin-top:20px;font-weight:600;font-size:16px;color:#003b71;}
#passenger-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);justify-content:center;align-items:flex-start;overflow-y:auto;z-index:30;padding-top:30px;}
#passenger-modal .modal-content{background:white;padding:30px;border-radius:12px;max-width:900px;width:95%;position:relative;box-shadow:0 8px 25px rgba(0,0,0,.25);}
#passenger-modal .close{position:absolute;top:15px;right:20px;cursor:pointer;font-size:28px;font-weight:700;color:#d7001c;}
.passenger-card{background:#f9f9f9;padding:20px;border-radius:10px;margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,0.05);}
.passenger-card h3{color:#003b71;margin-bottom:10px;}
.passenger-card label{font-weight:500;margin-bottom:4px;}
.passenger-card input,.passenger-card select{width:100%;padding:10px;margin-bottom:10px;border:1px solid #ccc;border-radius:6px;}
.ticket-preview{background:#fff;border:1px dashed #003b71;padding:15px;margin-top:15px;border-radius:10px;font-weight:600;color:#003b71;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideIn{from{transform:translateY(-50px);}to{transform:translateY(0);}}
@media(max-width:768px){.search-form{grid-template-columns:1fr 1fr;gap:10px;}table,th,td{font-size:14px;}}
</style>
</head>
<body>

<header>
<h1>LATAM Travel Assistance</h1>
<nav>
<a href="#buscar">Buscar Vuelos</a>
<a href="#contacto">Contacto</a>
</nav>
</header>

<section class="hero" id="buscar">
<h2>Reserva tu vuelo con LATAM</h2>

<form class="search-form" id="flight-form">
<button type="button" id="btn-oneway" class="toggle-btn active">Solo Ida</button>
<button type="button" id="btn-roundtrip" class="toggle-btn">Ida y Regreso</button>

<div style="position:relative;">
<input type="text" id="origin" placeholder="Origen" required autocomplete="off">
<div class="autocomplete-suggestions" id="origin-suggestions"></div>
</div>

<div style="position:relative;">
<input type="text" id="destination" placeholder="Destino" required autocomplete="off">
<div class="autocomplete-suggestions" id="destination-suggestions"></div>
</div>

<input type="date" id="departure" required>
<input type="date" id="return" style="display:none;">

<div class="passenger-selector">
<button type="button" id="minus-passenger">-</button>
<input type="text" id="passengers" value="1 Adulto" readonly style="width:90px;text-align:center;">
<button type="button" id="plus-passenger">+</button>
</div>

<div class="search-btn-container">
<button type="submit">Buscar Vuelos</button>
</div>
</form>

</section>

<div id="results-modal">
<div class="modal-content">
<span class="close" id="close-modal">&times;</span>
<h2>Resultados de Vuelos</h2>
<div id="results-list"></div>
<div id="trip-summary"></div>
</div>
</div>

<div id="passenger-modal">
<div class="modal-content">
<span class="close" id="close-passenger-modal">&times;</span>
<h2>Formulario y Resumen de Reserva</h2>
<div id="flight-summary"></div>
<form id="passenger-form"></form>
<div class="ticket-preview" id="ticket-preview" style="display:none;"></div>
<button id="btn-generate-pdf" style="display:none;background:#003b71;color:white;padding:12px 20px;border:none;border-radius:8px;font-weight:600;margin-top:10px;">Descargar Ticket (PDF)</button>
</div>
</div>

<script>
// === AEROPUERTOS COMPLETOS ===
const airports=[ "Santiago (SCL)","Antofagasta (ANF)","Arica (ARI)","Balmaceda (BBA)","Calama (CJC)","Concepción (CCP)","Copiapó (CPO)","Iquique (IQQ)","Isla de Pascua (IPC)","La Serena (LSC)","Osorno (ZOS)","Puerto Montt (PMC)","Punta Arenas (PUQ)","Temuco (ZCO)","Valdivia (ZAL)","Buenos Aires – Ezeiza (EZE)","Buenos Aires – Aeroparque (AEP)","Bariloche (BRC)","Mendoza (MDZ)","Salta (SLA)","Rosario (ROS)","Ushuaia (USH)","Lima (LIM)","Cusco (CUZ)","Arequipa (AQP)","Iquitos (IQT)","Tacna (TCQ)","Guayaquil (GYE)","Quito (UIO)","Baltra – Galápagos (GPS)","Bogotá (BOG)","Medellín (MDE)","Cali (CLO)","Cartagena (CTG)","Barranquilla (BAQ)","Bucaramanga (BGA)","Leticia (LET)","Cúcuta (CUC)","Pereira (PEI)","Asunción (ASU)","São Paulo – Guarulhos (GRU)","São Paulo – Congonhas (CGH)","Campinas – Viracopos (VCP)","Rio de Janeiro – Galeão (GIG)","Rio de Janeiro – Santos Dumont (SDU)","Belo Horizonte (CNF)","Brasília (BSB)","Fortaleza (FOR)","Recife (REC)","Porto Alegre (POA)","Salvador (SSA)","Manaus (MAO)","Curitiba (CWB)","Florianópolis (FLN)","Belém (BEL)","Boa Vista (BVB)","Campo Grande (CGR)","Goiania (GYN)","Maceió (MCZ)","João Pessoa (JPA)","Navegantes (NVT)","Foz do Iguaçu (IGU)","Natal (NAT)","Palmas (PMW)","São Luís (SLZ)","Miami (MIA)","Orlando (MCO)","Atlanta (ATL)","Chicago – ORD (ORD)","Los Angeles (LAX)","New York – JFK (JFK)","Cancún (CUN)","Ciudad de México (MEX)","Punta Cana (PUJ)","San José – CRC (SJO)","La Habana (HAV)","Oranjestad – Aruba (AUA)","Madrid (MAD)","Barcelona (BCN)","Brussels (BRU)","Lisbon (LIS)","Paris (CDG)","Rome (FCO)","Milan (MXP)","Frankfurt (FRA)","Auckland (AKL)","Melbourne (MEL)","Sydney (SYD)"];

// === AUTOCOMPLETE ===
function autocomplete(input,suggestionsId){
input.addEventListener("input",function(){
const value=this.value.toLowerCase();
const suggestions=document.getElementById(suggestionsId);
suggestions.innerHTML="";
if(!value) return;
airports.filter(a=>a.toLowerCase().includes(value)).forEach(a=>{
const div=document.createElement("div");div.textContent=a;div.onclick=()=>{input.value=a;suggestions.innerHTML="";};suggestions.appendChild(div);
});
});
}
autocomplete(document.getElementById("origin"),"origin-suggestions");
autocomplete(document.getElementById("destination"),"destination-suggestions");

// === PASAJEROS ===
let passengerCount=1;
const passengersInput=document.getElementById("passengers");
document.getElementById("plus-passenger").onclick=()=>{if(passengerCount<10)passengerCount++;passengersInput.value=passengerCount+" Adulto"+(passengerCount>1?"s":"");};
document.getElementById("minus-passenger").onclick=()=>{if(passengerCount>1)passengerCount--;passengersInput.value=passengerCount+" Adulto"+(passengerCount>1?"s":"");};

// === TOGGLE TIPO DE VIAJE ===
let isRoundTrip=false;
const btnOneWay=document.getElementById("btn-oneway");
const btnRoundTrip=document.getElementById("btn-roundtrip");
const returnInput=document.getElementById("return");
btnOneWay.onclick=()=>{isRoundTrip=false;btnOneWay.classList.add("active");btnRoundTrip.classList.remove("active");returnInput.style.display="none";}
btnRoundTrip.onclick=()=>{isRoundTrip=true;btnRoundTrip.classList.add("active");btnOneWay.classList.remove("active");returnInput.style.display="inline-block";}

// === GENERAR VUELOS ALEATORIOS ===
let flights=[],returnFlights=[];
function generateFlights(origin,destination){
flights=[];returnFlights=[];
for(let i=0;i<10;i++){
const hour=`${Math.floor(Math.random()*12+6)}:${Math.random()>0.5?'00':'30'}`;
let distance=Math.floor(Math.random()*4000+200);
let price,durationH;
if(distance<1000){price=Math.floor(Math.random()*240250+159750);durationH=Math.floor(distance/300)+1;}
else if(distance<2500){price=Math.floor(Math.random()*500000+400000);durationH=Math.floor(distance/500)+2;}
else{price=Math.floor(Math.random()*600000+900000);durationH=Math.floor(distance/700)+3;}
const duration=`${durationH}h ${Math.floor(Math.random()*60)}m`;
flights.push({origin,destination,hour,price,duration});
returnFlights.push({origin:destination,destination:origin,hour,price,duration});
}
}

// === MOSTRAR VUELOS ===
function showFlights(flightsArray){
let html="<table><tr><th>Vuelo</th><th>Horario</th><th>Precio Total COP</th><th>Duración</th><th>Acción</th></tr>";
let total=0;
flightsArray.forEach((f,i)=>{
let rf=returnFlights[i];
let tripTotal=(f.price+rf.price)*passengerCount;
total+=tripTotal;
html+=`<tr>
<td>${f.origin} → ${f.destination}${isRoundTrip? " / "+rf.origin+" → "+rf.destination : ""}</td>
<td>${f.hour}${isRoundTrip? " / "+rf.hour : ""}</td>
<td>$${tripTotal.toLocaleString()}</td>
<td>${f.duration}${isRoundTrip? " / "+rf.duration : ""}</td>
<td><button class="reserve-btn" onclick='openPassengerForm(${passengerCount},"${f.origin} → ${f.destination}","${rf.origin} → ${rf.destination}",${tripTotal})'>Reservar</button></td>
</tr>`;
});
html+="</table>";
document.getElementById("results-list").innerHTML=html;
document.getElementById("trip-summary").innerText=`Total aproximado para ${passengerCount} pasajero(s): $${total.toLocaleString()} COP`;
}

// === SUBMIT FORM VUELO ===
document.getElementById("flight-form").addEventListener("submit",function(e){
e.preventDefault();
const origin=document.getElementById("origin").value;
const destination=document.getElementById("destination").value;
generateFlights(origin,destination);
showFlights(flights);
document.getElementById("results-modal").style.display="flex";
});

// === CERRAR MODAL RESULTADOS ===
document.getElementById("close-modal").onclick=()=>{document.getElementById("results-modal").style.display="none";}
window.onclick=e=>{if(e.target.id==="results-modal")document.getElementById("results-modal").style.display="none";}

// === MODAL PASAJEROS ===
const passengerModal=document.getElementById("passenger-modal");
const closePassengerModal=document.getElementById("close-passenger-modal");
const passengerFields=document.getElementById("passenger-form");
const flightSummary=document.getElementById("flight-summary");
const ticketPreview=document.getElementById("ticket-preview");
const btnGeneratePDF=document.getElementById("btn-generate-pdf");

function openPassengerForm(count,outbound,inbound,total){
passengerFields.innerHTML="";
flightSummary.innerHTML=`<div>Ida: ${outbound}</div>${isRoundTrip? `<div>Regreso: ${inbound}</div>`:""}<div>Pasajeros: ${count}</div><div>Total aprox: $${total.toLocaleString()} COP</div>`;
for(let i=1;i<=count;i++){
const card=document.createElement("div");
card.className="passenger-card";
card.innerHTML=`<h3>Pasajero ${i}</h3>
<label>Nombre completo:</label><input type="text" name="fullName${i}" required placeholder="Nombre y Apellidos">
<label>Tipo de identificación:</label><select name="idType${i}" required>
<option value="">Seleccione</option>
<option value="CC">Cédula de ciudadanía</option>
<option value="CE">Cédula de extranjería</option>
<option value="Passport">Pasaporte</option></select>
<label>Número de identificación:</label><input type="text" name="idNumber${i}" required placeholder="Número">
<label>Fecha de nacimiento:</label><input type="date" name="dob${i}" required>`;
passengerFields.appendChild(card);
}
const submitBtn=document.createElement("button");
submitBtn.type="submit";
submitBtn.style.background="#003b71";
submitBtn.style.color="white";
submitBtn.style.padding="10px 20px";
submitBtn.style.border="none";
submitBtn.style.borderRadius="6px";
submitBtn.style.fontWeight="600";
submitBtn.style.marginTop="10px";
submitBtn.innerText="Finalizar Reserva";
passengerFields.appendChild(submitBtn);
passengerModal.style.display="flex";

passengerFields.onsubmit=function(e){
e.preventDefault();
generateTicketPDF(outbound,inbound,count,total);
}
}

closePassengerModal.onclick=()=>{passengerModal.style.display="none";}
window.onclick=e=>{if(e.target.id==="passenger-modal")passengerModal.style.display="none";}

// === PDF GENERATION ===
function generateTicketPDF(outbound,inbound,count,total){
const { jsPDF } = window.jspdf;
const doc=new jsPDF();
let y=20;
doc.setFontSize(16);
doc.text("LATAM Travel Assistance",20,y);
y+=10;
doc.setFontSize(12);
doc.text(`Vuelo ida: ${outbound}`,20,y); y+=7;
if(isRoundTrip) { doc.text(`Vuelo regreso: ${inbound}`,20,y); y+=7;}
doc.text(`Cantidad de pasajeros: ${count}`,20,y); y+=7;
doc.text(`Total: $${total.toLocaleString()} COP`,20,y); y+=10;
doc.text("Pasajeros:",20,y); y+=7;

for(let i=1;i<=count;i++){
const name=passengerFields[`fullName${i}`].value;
const idType=passengerFields[`idType${i}`].value;
const idNum=passengerFields[`idNumber${i}`].value;
const dob=passengerFields[`dob${i}`].value;
doc.text(`${i}. ${name} - ${idType}: ${idNum} - DOB: ${dob}`,20,y); y+=7;
}

doc.save("Reserva_LATAM.pdf");
ticketPreview.style.display="block";
ticketPreview.innerText="Ticket generado. ¡Descárguelo con el botón!";
btnGeneratePDF.style.display="inline-block";
btnGeneratePDF.onclick=()=>{doc.save("Reserva_LATAM.pdf");};
passengerModal.style.display="none";
}

</script>
</body>
</html>
