<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATAM Travel Assistance</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  margin: 0;
  padding: 0;
}

body {
  background: #f5f5f5;
  color: #333;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

/* Hero */
.hero {
  background-image: url('https://www.latamairlines.com/content/dam/latam/images/latam/hero-airplane.jpg');
  background-size: cover;
  background-position: center;
  padding: 80px 20px;
  text-align: center;
  color: #fff;
  border-radius: 12px;
  margin-bottom: 40px;
}

.hero h1 {
  font-size: 2.5rem;
  margin-bottom: 20px;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
}

.hero p {
  font-size: 1.2rem;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
}

/* Buscador */
.search-form {
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  justify-content: space-between;
  align-items: flex-end;
}

.search-form .form-group {
  flex: 1 1 180px;
  display: flex;
  flex-direction: column;
}

.search-form label {
  margin-bottom: 6px;
  font-weight: 500;
}

.search-form input, 
.search-form select {
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 1rem;
}

.search-form .radio-group {
  display: flex;
  gap: 20px;
  align-items: center;
  margin-top: 10px;
}

.search-form .radio-group label {
  font-weight: 400;
}

/* Botón Buscar Vuelos con gradiente y animación */
.search-form button {
  flex: 1 1 100%;
  padding: 16px 0;
  background: linear-gradient(90deg, #ff005c, #ff8a00);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 1.3rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 10px;
  box-shadow: 0 6px 15px rgba(255, 0, 92, 0.4);
}

.search-form button:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 25px rgba(255, 0, 92, 0.6);
}

/* Responsive */
@media(max-width: 768px) {
  .search-form {
    flex-direction: column;
  }

  .search-form button {
    flex: unset;
  }
}

/* Resultados modal */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.modal-content {
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  max-width: 600px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}

.close-modal {
  background: #ff0040;
  color: #fff;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  float: right;
}

/* Footer */
footer {
  margin-top: 50px;
  text-align: center;
  padding: 30px 20px;
  background: #222;
  color: #fff;
  border-radius: 12px 12px 0 0;
}
</style>
</head>
<body>

<div class="container">
  <div class="hero">
    <h1>LATAM Travel Assistance</h1>
    <p>Encuentra y reserva tus vuelos de forma fácil y rápida</p>
  </div>

  <form class="search-form" id="searchForm">
    <div class="form-group">
      <label for="tripType">Tipo de viaje</label>
      <div class="radio-group">
        <label><input type="radio" name="tripType" value="ida" checked> Solo ida</label>
        <label><input type="radio" name="tripType" value="idaRegreso"> Ida y regreso</label>
      </div>
    </div>

    <div class="form-group">
      <label for="from">Desde</label>
      <input type="text" id="from" placeholder="Ciudad o aeropuerto">
    </div>

    <div class="form-group">
      <label for="to">Hacia</label>
      <input type="text" id="to" placeholder="Ciudad o aeropuerto">
    </div>

    <div class="form-group">
      <label for="departure">Fecha de salida</label>
      <input type="date" id="departure">
    </div>

    <div class="form-group">
      <label for="return">Fecha de regreso</label>
      <input type="date" id="return">
    </div>

    <div class="form-group">
      <label for="passengers">Pasajeros</label>
      <select id="passengers">
        <option value="1">1 pasajero</option>
        <option value="2">2 pasajeros</option>
        <option value="3">3 pasajeros</option>
        <option value="4">4 pasajeros</option>
        <option value="5">5 pasajeros</option>
      </select>
    </div>

    <button type="submit">Buscar Vuelos</button>
  </form>
</div>

<!-- Modal de resultados -->
<div class="modal" id="resultsModal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeModal()">Cerrar</button>
    <h2>Resultados de vuelos</h2>
    <div id="resultsContainer"></div>
  </div>
</div>

<footer>
  <p>&copy; 2026 LATAM Airlines - Todos los derechos reservados</p>
</footer>

<script>
document.getElementById('searchForm').addEventListener('submit', function(e){
  e.preventDefault();
  document.getElementById('resultsModal').style.display = 'flex';
  document.getElementById('resultsContainer').innerHTML = '<p>Simulación de resultados de vuelos...</p>';
});

function closeModal(){
  document.getElementById('resultsModal').style.display = 'none';
}
</script>

</body>
</html>
