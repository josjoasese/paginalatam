<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroNova LATAM | Cotiza tu vuelo</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
}

h1{font-size:42px;margin-bottom:10px}
p{margin-bottom:40px;opacity:.9}

.card{
background:white;
color:#222;
padding:40px;
border-radius:20px;
width:420px;
box-shadow:0 30px 60px rgba(0,0,0,.3);
}

.card h2{
text-align:center;
margin-bottom:25px;
}

input, select{
width:100%;
padding:14px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#0066ff;
color:white;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#004bcc;
}

footer{
position:absolute;
bottom:15px;
font-size:13px;
opacity:.7;
}

datalist option{
font-size:14px;
}
</style>
</head>

<body>

<h1>✈ AeroNova LATAM</h1>
<p>Cotiza tu vuelo en segundos</p>

<div class="card">
<h2>Buscar Vuelo</h2>

<input list="ciudades" id="origen" placeholder="Ciudad de origen">
<input list="ciudades" id="destino" placeholder="Ciudad de destino">

<select>
<option>Clase Económica</option>
<option>Premium Economy</option>
<option>Business</option>
</select>

<button onclick="cotizar()">Cotizar Ahora</button>
</div>

<datalist id="ciudades">
<option value="Bogotá (BOG)">
<option value="Medellín (MDE)">
<option value="Cali (CLO)">
<option value="Cartagena (CTG)">
<option value="San Andrés (ADZ)">
<option value="Lima (LIM)">
<option value="Cusco (CUZ)">
<option value="Santiago (SCL)">
<option value="Buenos Aires - EZE (EZE)">
<option value="Buenos Aires - AEP (AEP)">
<option value="São Paulo - GRU (GRU)">
<option value="Rio de Janeiro - GIG (GIG)">
<option value="Montevideo (MVD)">
<option value="Quito (UIO)">
<option value="Guayaquil (GYE)">
<option value="La Paz (LPB)">
<option value="Santa Cruz (VVI)">
<option value="Miami (MIA)">
<option value="Orlando (MCO)">
<option value="Nueva York - JFK (JFK)">
<option value="Los Ángeles (LAX)">
<option value="Madrid (MAD)">
<option value="Barcelona (BCN)">
<option value="París (CDG)">
<option value="Frankfurt (FRA)">
<option value="Roma (FCO)">
<option value="Lisboa (LIS)">
<option value="Auckland (AKL)">
<option value="Sydney (SYD)">
<option value="Melbourne (MEL)">
<option value="Cancún (CUN)">
<option value="Punta Cana (PUJ)">
</datalist>

<footer>
© 2026 AeroNova LATAM - Todos los derechos reservados
</footer>

<script>
function cotizar(){
let origen=document.getElementById("origen").value;
let destino=document.getElementById("destino").value;

if(origen===""||destino===""){
alert("Por favor completa origen y destino");
return;
}

alert("Simulación de cotización:\n\nOrigen: "+origen+"\nDestino: "+destino+"\n\nTe contactaremos pronto.");
}
</script>

</body>
</html>
