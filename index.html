<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATAM Travel Assistance</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:#f4f7fb;
overflow:hidden;
}

/* ================= SCREENS ================= */

.screen{
width:100%;
height:100vh;
position:absolute;
top:0;
left:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
transition:all .4s ease;
background:linear-gradient(180deg,#ffffff,#eef4ff);
}

.hidden{
transform:translateX(100%);
opacity:0;
pointer-events:none;
}

/* ================= CARD ================= */

.card{
width:95%;
max-width:1000px;
background:#fff;
padding:40px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.1);
animation:fadeIn .6s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(30px)}
to{opacity:1;transform:translateY(0)}
}

h1{color:#002b7f;margin-bottom:25px;}

/* ================= TOGGLE ================= */

.toggle{
display:flex;
gap:15px;
margin-bottom:20px;
}

.toggle button{
flex:1;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
background:#e6ecff;
color:#002b7f;
transition:.3s;
}

.toggle button.active{
background:#002b7f;
color:#fff;
}

/* ================= INPUTS ================= */

.input-group{margin-bottom:18px;position:relative;}

input{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
}

.suggestions{
position:absolute;
background:#fff;
width:100%;
max-height:200px;
overflow:auto;
border-radius:10px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
z-index:10;
display:none;
}

.suggestions div{
padding:10px;
cursor:pointer;
}

.suggestions div:hover{background:#f0f4ff;}

/* ================= BUTTON ================= */

.search-btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-weight:700;
background:#002b7f;
color:#fff;
cursor:pointer;
transition:.3s;
}

.search-btn:hover{background:#001c4d;}

/* ================= RESULTS ================= */

.results-container{
width:95%;
max-width:1100px;
height:85vh;
overflow-y:auto;
padding:20px;
}

.flight-card{
background:#fff;
border-radius:15px;
padding:20px;
margin-bottom:15px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
display:flex;
justify-content:space-between;
align-items:center;
transition:.3s;
}

.flight-card:hover{transform:translateY(-3px);}

.price{font-weight:700;color:#002b7f;font-size:18px;}

.select-btn{
background:#002b7f;
color:#fff;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
}

/* ================= BACK ================= */

.back-btn{
position:absolute;
top:20px;
left:20px;
background:#002b7f;
color:#fff;
border:none;
padding:8px 15px;
border-radius:8px;
cursor:pointer;
}

/* ================= SEAT MAP ================= */

.seat-map{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
margin-top:20px;
}

.seat{
padding:10px;
text-align:center;
border-radius:6px;
cursor:pointer;
font-size:12px;
font-weight:600;
}

.seat.available{background:#e6ecff;color:#002b7f;}
.seat.selected{background:#002b7f;color:#fff;}
.seat.occupied{background:#ccc;color:#666;cursor:not-allowed;}

</style>
</head>
<body>

<!-- SCREEN 1 -->
<div class="screen" id="screen1">
<div class="card">
<h1>Buscar vuelos</h1>

<div class="toggle">
<button id="oneWayBtn" class="active">Solo ida</button>
<button id="roundTripBtn">Ida y regreso</button>
</div>

<div class="input-group">
<input type="text" id="origin" placeholder="Origen">
<div class="suggestions" id="originSuggestions"></div>
</div>

<div class="input-group">
<input type="text" id="destination" placeholder="Destino">
<div class="suggestions" id="destinationSuggestions"></div>
</div>

<div class="input-group">
<input type="date" id="departureDate">
</div>

<div class="input-group" id="returnGroup" style="display:none;">
<input type="date" id="returnDate">
</div>

<button class="search-btn" id="searchBtn">Buscar vuelos</button>
</div>
</div>

<!-- SCREEN 2 -->
<div class="screen hidden" id="screen2">
<button class="back-btn" id="backToSearch">Volver</button>
<div class="results-container" id="results"></div>
</div>

<!-- SCREEN 3 -->
<div class="screen hidden" id="screen3">
<button class="back-btn" id="backToResults">Volver</button>

<div class="card" style="max-width:1100px;height:90vh;overflow:auto;">
<h1>Selecciona tu asiento - Airbus A320</h1>

<div id="seatMap" class="seat-map"></div>

<div style="margin-top:25px;text-align:right;">
<h2>Total adicional: <span id="seatTotal">$0</span></h2>
<button class="search-btn" id="confirmSeatBtn">Confirmar asiento</button>
</div>

</div>
</div>

<script>

/* ================= ELEMENTOS ================= */

const screen1=document.getElementById("screen1");
const screen2=document.getElementById("screen2");
const screen3=document.getElementById("screen3");

const originInput=document.getElementById("origin");
const destinationInput=document.getElementById("destination");
const departureInput=document.getElementById("departureDate");
const returnInput=document.getElementById("returnDate");
const returnGroup=document.getElementById("returnGroup");

const resultsContainer=document.getElementById("results");
const seatMap=document.getElementById("seatMap");
const seatTotal=document.getElementById("seatTotal");

/* ================= AEROPUERTOS ================= */

const airports=[
"BOG - Bogotá","MDE - Medellín","CLO - Cali","CTG - Cartagena",
"SMR - Santa Marta","ADZ - San Andrés","LIM - Lima",
"SCL - Santiago","GRU - São Paulo","EZE - Buenos Aires",
"MIA - Miami","MAD - Madrid","JFK - Nueva York",
"LAX - Los Ángeles","CDG - París","FCO - Roma",
"CUN - Cancún","PTY - Panamá"
];

/* ================= AUTOCOMPLETE ================= */

function setupAutocomplete(input, boxId){
const box=document.getElementById(boxId);

input.addEventListener("input",function(){
const val=this.value.toLowerCase();
box.innerHTML="";
if(val.length<1){box.style.display="none";return;}
const filtered=airports.filter(a=>a.toLowerCase().includes(val));
filtered.forEach(a=>{
const div=document.createElement("div");
div.textContent=a;
div.onclick=()=>{
input.value=a;
box.style.display="none";
};
box.appendChild(div);
});
box.style.display="block";
});
}

setupAutocomplete(originInput,"originSuggestions");
setupAutocomplete(destinationInput,"destinationSuggestions");

/* ================= TOGGLE ================= */

let isRoundTrip=false;

document.getElementById("oneWayBtn").addEventListener("click",()=>{
isRoundTrip=false;
returnGroup.style.display="none";
oneWayBtn.classList.add("active");
roundTripBtn.classList.remove("active");
});

document.getElementById("roundTripBtn").addEventListener("click",()=>{
isRoundTrip=true;
returnGroup.style.display="block";
roundTripBtn.classList.add("active");
oneWayBtn.classList.remove("active");
});

/* ================= GENERAR VUELOS ================= */

function randomTime(){
let h=Math.floor(Math.random()*24);
let m=Math.floor(Math.random()*60);
return h.toString().padStart(2,"0")+":"+m.toString().padStart(2,"0");
}

function generateFlights(){
let flights=[];
let count=Math.floor(Math.random()*16)+10;
for(let i=0;i<count;i++){
flights.push({
time:randomTime(),
price:Math.floor(Math.random()*800000)+200000
});
}
flights.sort((a,b)=>a.time.localeCompare(b.time));
return flights;
}

/* ================= BUSCAR ================= */

document.getElementById("searchBtn").addEventListener("click",()=>{

if(!originInput.value||!destinationInput.value||!departureInput.value){
alert("Completa todos los campos");
return;
}

resultsContainer.innerHTML="";
const flights=generateFlights();

flights.forEach(f=>{
const card=document.createElement("div");
card.className="flight-card";
card.innerHTML=`
<div>
<strong>${originInput.value} → ${destinationInput.value}</strong>
<div>Salida: ${f.time}</div>
</div>
<div>
<div class="price">$${f.price.toLocaleString("es-CO")}</div>
<button class="select-btn">Seleccionar</button>
</div>
`;
resultsContainer.appendChild(card);
});

screen1.classList.add("hidden");
screen2.classList.remove("hidden");

});

/* ================= BACK ================= */

document.getElementById("backToSearch").onclick=()=>{
screen2.classList.add("hidden");
screen1.classList.remove("hidden");
};

/* ================= SEAT MAP ================= */

let selectedSeat=null;
let selectedSeatPrice=0;

function generateSeatMap(){
seatMap.innerHTML="";
const rows=30;
const letters=["A","B","C"," ","D","E","F"];

for(let r=1;r<=rows;r++){
letters.forEach(l=>{
if(l===" "){
seatMap.appendChild(document.createElement("div"));
return;
}

const seat=document.createElement("div");
seat.classList.add("seat");

const occupied=Math.random()<0.25;
if(occupied) seat.classList.add("occupied");
else seat.classList.add("available");

seat.textContent=r+l;

seat.onclick=()=>{
if(seat.classList.contains("occupied")) return;

document.querySelectorAll(".seat.selected").forEach(s=>{
s.classList.remove("selected");
s.classList.add("available");
});

seat.classList.remove("available");
seat.classList.add("selected");

selectedSeat=r+l;

if(l==="A"||l==="F") selectedSeatPrice=40000;
else if(l==="C"||l==="D") selectedSeatPrice=30000;
else selectedSeatPrice=15000;

seatTotal.textContent="$"+selectedSeatPrice.toLocaleString("es-CO");
};

seatMap.appendChild(seat);
});
}
}

/* ================= IR A ASIENTOS ================= */

document.addEventListener("click",(e)=>{
if(e.target.classList.contains("select-btn")){
screen2.classList.add("hidden");
screen3.classList.remove("hidden");
generateSeatMap();
}
});

/* ================= BACK RESULTADOS ================= */

document.getElementById("backToResults").onclick=()=>{
screen3.classList.add("hidden");
screen2.classList.remove("hidden");
};

/* ================= CONFIRMAR ================= */

document.getElementById("confirmSeatBtn").onclick=()=>{
if(!selectedSeat){
alert("Selecciona un asiento");
return;
}
alert("Asiento "+selectedSeat+
"\nCosto adicional: $"+selectedSeatPrice.toLocaleString("es-CO"));
};

</script>
</body>
</html>
