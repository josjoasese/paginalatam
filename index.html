<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATAM Travel Assistance</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif;}
body{background:#f4f6fa;}

.container{
max-width:1200px;
margin:60px auto;
background:white;
padding:50px;
border-radius:24px;
box-shadow:0 30px 60px rgba(0,0,0,0.08);
}

h1{margin-bottom:25px;font-weight:700;}

.trip-toggle{
display:flex;
gap:20px;
margin-bottom:25px;
}

.trip-toggle label{
cursor:pointer;
font-weight:500;
}

.search-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:18px;
align-items:end;
}

.search-grid input{
padding:14px;
border-radius:14px;
border:1px solid #ddd;
transition:0.2s;
}

.search-grid input:focus{
border:1px solid #d40000;
outline:none;
}

.search-btn{
grid-column:1/-1;
padding:18px;
border:none;
border-radius:16px;
font-weight:700;
font-size:16px;
background:linear-gradient(135deg,#d40000,#7a0000);
color:white;
cursor:pointer;
transition:0.3s;
box-shadow:0 15px 30px rgba(212,0,0,0.35);
}

.search-btn:hover{
transform:translateY(-3px);
box-shadow:0 20px 40px rgba(212,0,0,0.45);
}

.error{
color:#d40000;
margin-top:15px;
display:none;
font-weight:500;
}

.modal{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.55);
display:none;
justify-content:center;
align-items:center;
animation:fadeIn .2s ease-in-out;
}

@keyframes fadeIn{
from{opacity:0}
to{opacity:1}
}

.modal-content{
background:white;
padding:35px;
border-radius:24px;
width:90%;
max-width:650px;
max-height:90vh;
overflow:auto;
animation:scaleIn .2s ease-in-out;
}

@keyframes scaleIn{
from{transform:scale(.95);opacity:0}
to{transform:scale(1);opacity:1}
}

.flight-option{
padding:18px;
border:1px solid #eee;
border-radius:16px;
margin-bottom:15px;
cursor:pointer;
transition:0.2s;
display:flex;
justify-content:space-between;
align-items:center;
}

.flight-option:hover{
border:1px solid #d40000;
background:#fff5f5;
}

.selected{
border:2px solid #d40000 !important;
background:#fff0f0;
}

.passenger-form input{
width:100%;
padding:12px;
margin-bottom:12px;
border-radius:12px;
border:1px solid #ddd;
}

.btn-primary{
background:#d40000;
color:white;
padding:15px;
border:none;
border-radius:14px;
cursor:pointer;
width:100%;
font-weight:600;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">
<h1>Reserva tu vuelo</h1>

<div class="trip-toggle">
<label><input type="radio" name="tipoViaje" value="idaVuelta" checked onchange="toggleRegreso()"> Ida y Regreso</label>
<label><input type="radio" name="tipoViaje" value="soloIda" onchange="toggleRegreso()"> Solo Ida</label>
</div>

<div class="search-grid">
<input type="text" id="origen" placeholder="Origen (Ej: MAD - Madrid)">
<input type="text" id="destino" placeholder="Destino (Ej: SCL - Santiago)">
<input type="date" id="fechaSalida">
<input type="date" id="fechaRegreso">
<input type="number" id="pasajeros" min="1" value="1">
<button class="search-btn" onclick="buscarVuelos()">Buscar vuelos</button>
</div>

<div class="error" id="errorMensaje"></div>
</div>

<!-- RESULTADOS -->
<div class="modal" id="modalResultados">
<div class="modal-content">
<h2>Selecciona tu vuelo</h2>
<div id="listaVuelos"></div>
<button class="btn-primary" onclick="continuarPasajeros()">Continuar</button>
</div>
</div>

<!-- PASAJEROS -->
<div class="modal" id="modalPasajeros">
<div class="modal-content">
<h2>Datos de pasajeros</h2>
<div id="formulariosPasajeros"></div>
<button class="btn-primary" onclick="generarTicket()">Confirmar Reserva</button>
</div>
</div>

<script>
let vueloSeleccionado=null;

function toggleRegreso(){
const tipo=document.querySelector('input[name="tipoViaje"]:checked').value;
const regreso=document.getElementById("fechaRegreso");
regreso.disabled = (tipo==="soloIda");
if(tipo==="soloIda"){regreso.value="";}
}

function mostrarError(msg){
const box=document.getElementById("errorMensaje");
box.innerText=msg;
box.style.display="block";
}

function buscarVuelos(){
const origen=document.getElementById("origen").value.trim();
const destino=document.getElementById("destino").value.trim();
const fechaSalida=document.getElementById("fechaSalida").value;
const tipo=document.querySelector('input[name="tipoViaje"]:checked').value;
const fechaRegreso=document.getElementById("fechaRegreso").value;
const pasajeros=document.getElementById("pasajeros").value;

if(!origen || !destino || !fechaSalida || !pasajeros){
mostrarError("Completa los campos obligatorios.");
return;
}

if(tipo==="idaVuelta" && !fechaRegreso){
mostrarError("Selecciona fecha de regreso.");
return;
}

if(origen===destino){
mostrarError("Origen y destino no pueden ser iguales.");
return;
}

document.getElementById("errorMensaje").style.display="none";

const basePrice=400+Math.floor(Math.random()*300);
const vuelos=[
{hora:"08:00",precio:basePrice},
{hora:"13:30",precio:basePrice+50},
{hora:"19:45",precio:basePrice+120}
];

const lista=document.getElementById("listaVuelos");
lista.innerHTML="";
vueloSeleccionado=null;

vuelos.forEach(v=>{
const div=document.createElement("div");
div.className="flight-option";
div.innerHTML=`<div>${v.hora}</div><div><strong>$${v.precio}</strong></div>`;
div.onclick=()=>{
document.querySelectorAll(".flight-option").forEach(el=>el.classList.remove("selected"));
div.classList.add("selected");
vueloSeleccionado=v;
};
lista.appendChild(div);
});

document.getElementById("modalResultados").style.display="flex";
}

function continuarPasajeros(){
if(!vueloSeleccionado){
alert("Selecciona un vuelo.");
return;
}
document.getElementById("modalResultados").style.display="none";

const cantidad=document.getElementById("pasajeros").value;
const cont=document.getElementById("formulariosPasajeros");
cont.innerHTML="";

for(let i=1;i<=cantidad;i++){
cont.innerHTML+=`
<div class="passenger-form">
<h4>Pasajero ${i}</h4>
<input type="text" placeholder="Nombre completo" required>
<input type="text" placeholder="Documento" required>
</div>`;
}

document.getElementById("modalPasajeros").style.display="flex";
}

function generarTicket(){
const { jsPDF } = window.jspdf;
const doc=new jsPDF();

doc.setFontSize(18);
doc.text("LATAM Ticket Electrónico",20,20);

doc.setFontSize(12);
doc.text("Hora: "+vueloSeleccionado.hora,20,40);
doc.text("Precio: $"+vueloSeleccionado.precio,20,50);
doc.text("Pasajeros: "+document.getElementById("pasajeros").value,20,60);

doc.save("ticket_latam.pdf");

document.getElementById("modalPasajeros").style.display="none";
alert("Reserva confirmada ✔");
}
</script>

</body>
</html>
