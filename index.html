<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATAM Travel Assistance</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Inter',sans-serif;
}

body{
  background:#f4f6f9;
  color:#111;
}

/* ================= STEP PROGRESS ================= */

.stepper{
  display:flex;
  justify-content:center;
  gap:40px;
  padding:20px;
  background:#fff;
  border-bottom:1px solid #eee;
  font-weight:500;
}

.step{
  opacity:.4;
  transition:.3s;
}

.step.active{
  opacity:1;
  color:#d71920;
  font-weight:600;
}

/* ================= SCREENS ================= */

section{
  display:none;
  padding:40px 20px;
  min-height:calc(100vh - 80px);
}

section.active{
  display:block;
}

/* ================= HERO ================= */

.hero{
  text-align:center;
  padding:60px 20px;
}

.hero h1{
  font-size:38px;
  margin-bottom:15px;
}

.search-card{
  max-width:900px;
  margin:40px auto;
  background:#fff;
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.search-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
}

.search-grid input{
  padding:12px;
  border-radius:8px;
  border:1px solid #ddd;
}

.search-btn{
  margin-top:25px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#d71920,#8b0000);
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}

.search-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(215,25,32,.4);
}

/* ================= RESULTS ================= */

.results-header{
  max-width:1000px;
  margin:0 auto 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.flight-list{
  max-width:1000px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.flight-card{
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.flight-info{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.flight-price{
  font-weight:600;
  font-size:18px;
}

.select-btn{
  padding:10px 18px;
  border-radius:8px;
  border:none;
  background:#d71920;
  color:#fff;
  cursor:pointer;
}

/* ================= PASSENGERS ================= */

.passenger-layout{
  max-width:1000px;
  margin:0 auto;
  display:grid;
  grid-template-columns:300px 1fr;
  gap:40px;
}

.summary-box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.passenger-form{
  background:#fff;
  padding:30px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.passenger-form input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border-radius:8px;
  border:1px solid #ddd;
}

.confirm-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#d71920;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

/* ================= CONFIRMATION ================= */

.confirmation-box{
  max-width:600px;
  margin:80px auto;
  text-align:center;
  background:#fff;
  padding:40px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.confirmation-box h2{
  margin-bottom:15px;
}

.code{
  font-size:22px;
  font-weight:600;
  margin:20px 0;
}

.home-btn{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:8px;
  background:#111;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- ================= STEPPER ================= -->
<div class="stepper">
  <div class="step active" id="step1">1 Buscar</div>
  <div class="step" id="step2">2 Elegir</div>
  <div class="step" id="step3">3 Pasajeros</div>
  <div class="step" id="step4">4 Confirmación</div>
</div>

<!-- ================= SCREEN 1 HOME ================= -->
<section id="home-screen" class="active">

<div class="hero">
  <h1>Reserva tu próximo vuelo</h1>
</div>

<div class="search-card">
  <div class="search-grid">
    <input type="text" placeholder="Origen">
    <input type="text" placeholder="Destino">
    <input type="date">
    <input type="date">
    <input type="number" placeholder="Pasajeros" min="1" value="1">
  </div>
  <button class="search-btn" onclick="goToResults()">Buscar vuelos</button>
</div>

</section>

<!-- ================= SCREEN 2 RESULTS ================= -->
<section id="results-screen">

<div class="results-header">
  <h2>Vuelos disponibles</h2>
  <button onclick="goHome()">Modificar búsqueda</button>
</div>

<div class="flight-list">
  <div class="flight-card">
    <div class="flight-info">
      <strong>08:00 → 12:00</strong>
      <span>Duración: 4h</span>
      <span>Directo</span>
    </div>
    <div>
      <div class="flight-price">$420 USD</div>
      <button class="select-btn" onclick="goToPassengers()">Seleccionar</button>
    </div>
  </div>
</div>

</section>

<!-- ================= SCREEN 3 PASSENGERS ================= -->
<section id="passenger-screen">

<div class="passenger-layout">

<div class="summary-box">
  <h3>Resumen del viaje</h3>
  <p>BOG → SCL</p>
  <p>08:00 → 12:00</p>
  <p>Total: $420 USD</p>
</div>

<div class="passenger-form">
  <h3>Datos del pasajero</h3>
  <input type="text" placeholder="Nombre completo">
  <input type="text" placeholder="Documento">
  <input type="email" placeholder="Correo electrónico">
  <button class="confirm-btn" onclick="goToConfirmation()">Confirmar reserva</button>
</div>

</div>

</section>

<!-- ================= SCREEN 4 CONFIRMATION ================= -->
<section id="confirmation-screen">

<div class="confirmation-box">
  <h2>✔ Reserva confirmada</h2>
  <div class="code">Código: LA82KF</div>
  <p>Tu vuelo ha sido reservado con éxito.</p>
  <button class="home-btn" onclick="goHome()">Volver al inicio</button>
</div>

</section>

<script>
function showScreen(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function updateStep(step){
  document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"));
  document.getElementById("step"+step).classList.add("active");
}

function goHome(){
  showScreen("home-screen");
  updateStep(1);
}

function goToResults(){
  showScreen("results-screen");
  updateStep(2);
}

function goToPassengers(){
  showScreen("passenger-screen");
  updateStep(3);
}

function goToConfirmation(){
  showScreen("confirmation-screen");
  updateStep(4);
}
</script>

</body>
</html>
