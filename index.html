<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATAM Travel Assistance</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* ============================= */
/* RESET */
/* ============================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

body{
    background:#f4f8fc;
    color:#1c1c1c;
    overflow:hidden;
}

/* ============================= */
/* VARIABLES LATAM STYLE */
/* ============================= */

:root{
    --latam-blue:#003B8E;
    --latam-light:#0051C3;
    --latam-white:#ffffff;
    --latam-gray:#e9eef4;
    --latam-shadow:0 20px 50px rgba(0,0,0,0.08);
}

/* ============================= */
/* PANTALLAS FULL */
/* ============================= */

.screen{
    width:100%;
    height:100vh;
    position:absolute;
    top:0;
    left:0;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:all .5s ease;
    opacity:0;
    pointer-events:none;
}

.screen.active{
    opacity:1;
    pointer-events:auto;
}

/* ============================= */
/* TARJETAS PRINCIPALES */
/* ============================= */

.card{
    width:90%;
    max-width:1100px;
    background:var(--latam-white);
    border-radius:20px;
    box-shadow:var(--latam-shadow);
    padding:40px;
    animation:fadeIn .6s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(30px);}
    to{opacity:1; transform:translateY(0);}
}

/* ============================= */
/* TITULOS */
/* ============================= */

h1{
    font-size:32px;
    font-weight:800;
    margin-bottom:25px;
    color:var(--latam-blue);
}

/* ============================= */
/* BOTONES PREMIUM */
/* ============================= */

.btn{
    padding:15px 25px;
    border-radius:12px;
    border:none;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
    font-size:15px;
}

.btn-primary{
    background:var(--latam-blue);
    color:white;
}

.btn-primary:hover{
    background:var(--latam-light);
    transform:translateY(-2px);
}

.btn-secondary{
    background:#eef2f8;
}

/* ============================= */
/* INPUTS */
/* ============================= */

.input-group{
    display:flex;
    flex-direction:column;
    margin-bottom:20px;
}

input, select{
    padding:14px;
    border-radius:10px;
    border:1px solid #d5dbe3;
    margin-top:5px;
    font-size:14px;
}

input:focus{
    outline:none;
    border-color:var(--latam-blue);
}

/* ============================= */
/* AUTOCOMPLETE */
/* ============================= */

.autocomplete-list{
    position:absolute;
    background:white;
    width:100%;
    max-height:220px;
    overflow-y:auto;
    border-radius:10px;
    box-shadow:var(--latam-shadow);
    z-index:1000;
}

.autocomplete-item{
    padding:10px;
    cursor:pointer;
}

.autocomplete-item:hover{
    background:var(--latam-gray);
}

/* ============================= */
/* RESULTADOS SCROLL */
/* ============================= */

.results-container{
    max-height:60vh;
    overflow-y:auto;
    margin-top:20px;
}

.flight-card{
    padding:20px;
    border-radius:15px;
    border:1px solid #e4e8ef;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:.3s;
}

.flight-card:hover{
    box-shadow:var(--latam-shadow);
}

/* ============================= */
/* ASIENTOS */
/* ============================= */

.seat-map{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    margin-top:20px;
}

.seat{
    padding:10px;
    text-align:center;
    border-radius:6px;
    background:#dfe6f2;
    cursor:pointer;
    font-size:12px;
}

.seat.selected{
    background:var(--latam-blue);
    color:white;
}

.seat.occupied{
    background:#9aa7bd;
    cursor:not-allowed;
}

/* ============================= */
/* FOOTER */
/* ============================= */

.footer{
    position:absolute;
    bottom:20px;
    font-size:12px;
    color:#6b7a99;
}

</style>
</head>
<body>
  <!-- ============================= -->
<!-- PANTALLA 1 - BUSCADOR -->
<!-- ============================= -->

<div class="screen active" id="screen1">
    <div class="card">
        <h1>Reservar vuelo</h1>

        <div style="display:flex; gap:15px; margin-bottom:25px;">
            <button class="btn btn-secondary" id="oneWayBtn">Solo ida</button>
            <button class="btn btn-primary" id="roundTripBtn">Ida y regreso</button>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; position:relative;">
            
            <div class="input-group">
                <label>Origen</label>
                <input type="text" id="originInput" autocomplete="off">
                <div id="originList" class="autocomplete-list"></div>
            </div>

            <div class="input-group">
                <label>Destino</label>
                <input type="text" id="destinationInput" autocomplete="off">
                <div id="destinationList" class="autocomplete-list"></div>
            </div>

            <div class="input-group">
                <label>Fecha ida</label>
                <input type="date" id="departureDate">
            </div>

            <div class="input-group" id="returnGroup">
                <label>Fecha regreso</label>
                <input type="date" id="returnDate">
            </div>

        </div>

        <div style="margin-top:30px;">
            <button class="btn btn-primary" style="width:100%; font-size:18px;" id="searchBtn">
                Buscar vuelos
            </button>
        </div>
    </div>
</div>


<!-- ============================= -->
<!-- PANTALLA 2 - RESULTADOS -->
<!-- ============================= -->

<div class="screen" id="screen2">
    <div class="card">
        <h1>Selecciona tu vuelo</h1>
        <div class="results-container" id="resultsContainer"></div>
    </div>
</div>


<!-- ============================= -->
<!-- PANTALLA 3 - ASIENTOS -->
<!-- ============================= -->

<div class="screen" id="screen3">
    <div class="card">
        <h1>Selecciona tu asiento - Airbus A320</h1>
        <div class="seat-map" id="seatMap"></div>
        <div style="margin-top:25px;">
            <button class="btn btn-primary" id="continuePassenger">
                Continuar
            </button>
        </div>
    </div>
</div>


<!-- ============================= -->
<!-- PANTALLA 4 - PASAJERO -->
<!-- ============================= -->

<div class="screen" id="screen4">
    <div class="card">
        <h1>Datos del pasajero</h1>

        <div class="input-group">
            <label>Nombre completo</label>
            <input type="text" id="passengerName">
        </div>

        <div class="input-group">
            <label>Equipaje adicional</label>
            <select id="extraBaggage">
                <option value="0">Sin equipaje extra</option>
                <option value="80000">1 maleta adicional (+80.000 COP)</option>
                <option value="150000">2 maletas adicionales (+150.000 COP)</option>
            </select>
        </div>

        <div style="margin-top:20px; font-weight:700;" id="totalPrice">
            Total: 0 COP
        </div>

        <div style="margin-top:25px;">
            <button class="btn btn-primary" id="confirmBtn">
                Confirmar reserva
            </button>
        </div>
    </div>
</div>

<div class="footer">
    © 2026 LATAM Travel Assistance - Sistema simulado
</div>
<script>

/* ============================= */
/* BASE AMPLIADA AEROPUERTOS LATAM */
/* ============================= */

const airports = [
"BOG - Bogotá - Colombia",
"MDE - Medellín - Colombia",
"CLO - Cali - Colombia",
"CTG - Cartagena - Colombia",
"SMR - Santa Marta - Colombia",
"LIM - Lima - Perú",
"SCL - Santiago - Chile",
"EZE - Buenos Aires - Argentina",
"AEP - Buenos Aires Aeroparque - Argentina",
"GRU - São Paulo - Brasil",
"GIG - Río de Janeiro - Brasil",
"UIO - Quito - Ecuador",
"GYE - Guayaquil - Ecuador",
"ASU - Asunción - Paraguay",
"MIA - Miami - Estados Unidos",
"JFK - New York - Estados Unidos",
"LAX - Los Ángeles - Estados Unidos",
"MAD - Madrid - España",
"BCN - Barcelona - España",
"CDG - París - Francia"
];

/* ============================= */
/* VARIABLES GLOBALES */
/* ============================= */

let selectedFlightPrice = 0;
let selectedSeat = null;
let tripType = "round";

/* ============================= */
/* NAVEGACION ENTRE PANTALLAS */
/* ============================= */

function goToScreen(screenId){
    document.querySelectorAll(".screen").forEach(s=>{
        s.classList.remove("active");
    });
    document.getElementById(screenId).classList.add("active");
}

/* ============================= */
/* TOGGLE SOLO IDA / IDA REGRESO */
/* ============================= */

const oneWayBtn = document.getElementById("oneWayBtn");
const roundTripBtn = document.getElementById("roundTripBtn");
const returnGroup = document.getElementById("returnGroup");

oneWayBtn.onclick = () => {
    tripType = "oneway";
    returnGroup.style.display = "none";
    oneWayBtn.classList.add("btn-primary");
    oneWayBtn.classList.remove("btn-secondary");
    roundTripBtn.classList.add("btn-secondary");
    roundTripBtn.classList.remove("btn-primary");
};

roundTripBtn.onclick = () => {
    tripType = "round";
    returnGroup.style.display = "block";
    roundTripBtn.classList.add("btn-primary");
    roundTripBtn.classList.remove("btn-secondary");
    oneWayBtn.classList.add("btn-secondary");
    oneWayBtn.classList.remove("btn-primary");
};

/* ============================= */
/* AUTOCOMPLETE REAL */
/* ============================= */

function setupAutocomplete(inputId, listId){
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);

    input.addEventListener("input", ()=>{
        const value = input.value.toLowerCase();
        list.innerHTML = "";

        if(!value) return;

        const filtered = airports.filter(a => 
            a.toLowerCase().includes(value)
        );

        filtered.forEach(item=>{
            const div = document.createElement("div");
            div.classList.add("autocomplete-item");
            div.textContent = item;
            div.onclick = ()=>{
                input.value = item;
                list.innerHTML = "";
            };
            list.appendChild(div);
        });
    });

    document.addEventListener("click", (e)=>{
        if(e.target !== input){
            list.innerHTML = "";
        }
    });
}

setupAutocomplete("originInput","originList");
setupAutocomplete("destinationInput","destinationList");

</script>
<script>

/* ============================= */
/* GENERADOR DE HORAS ORDENADAS */
/* ============================= */

function generateFlightTimes(count){
    let times = [];

    while(times.length < count){
        let hour = Math.floor(Math.random()*24);
        let minute = Math.floor(Math.random()*60);

        let formatted = 
            (hour < 10 ? "0"+hour : hour) + ":" +
            (minute < 10 ? "0"+minute : minute);

        if(!times.includes(formatted)){
            times.push(formatted);
        }
    }

    return times.sort();
}

/* ============================= */
/* PRECIO DINAMICO POR FECHA */
/* ============================= */

function calculateDynamicPrice(date){
    if(!date) return 300000;

    const selectedDate = new Date(date);
    const today = new Date();
    const diffDays = Math.ceil((selectedDate - today)/(1000*60*60*24));

    let base = 250000 + Math.random()*150000;

    if(diffDays < 7){
        base += 120000;
    } else if(diffDays < 20){
        base += 60000;
    }

    return Math.round(base);
}

/* ============================= */
/* BUSCAR VUELOS */
/* ============================= */

document.getElementById("searchBtn").onclick = ()=>{

    const origin = document.getElementById("originInput").value;
    const destination = document.getElementById("destinationInput").value;
    const departureDate = document.getElementById("departureDate").value;

    if(!origin || !destination || !departureDate){
        alert("Completa todos los campos.");
        return;
    }

    const container = document.getElementById("resultsContainer");
    container.innerHTML = "";

    const flightCount = Math.floor(Math.random()*16)+10; // 10-25 vuelos
    const times = generateFlightTimes(flightCount);

    times.forEach(time=>{
        const price = calculateDynamicPrice(departureDate);

        const div = document.createElement("div");
        div.classList.add("flight-card");

        div.innerHTML = `
            <div>
                <strong>${origin.split(" - ")[0]} → ${destination.split(" - ")[0]}</strong><br>
                Salida: ${time}
            </div>
            <div>
                <strong>${price.toLocaleString()} COP</strong><br>
                <button class="btn btn-primary selectFlightBtn">Seleccionar</button>
            </div>
        `;

        div.querySelector(".selectFlightBtn").onclick = ()=>{
            selectedFlightPrice = price;
            goToScreen("screen3");
            generateSeats();
        };

        container.appendChild(div);
    });

    goToScreen("screen2");
};

</script>
<script>

/* ============================= */
/* GENERAR ASIENTOS A320 */
/* ============================= */

function generateSeats(){

    const seatMap = document.getElementById("seatMap");
    seatMap.innerHTML = "";
    selectedSeat = null;

    const rows = 30;
    const letters = ["A","B","C","D","E","F"];

    for(let r=1; r<=rows; r++){
        letters.forEach(letter=>{
            const seat = document.createElement("div");
            seat.classList.add("seat");
            seat.textContent = r+letter;

            // algunos asientos ocupados aleatorios
            if(Math.random() < 0.2){
                seat.classList.add("occupied");
            }

            seat.onclick = ()=>{
                if(seat.classList.contains("occupied")) return;

                document.querySelectorAll(".seat").forEach(s=>{
                    s.classList.remove("selected");
                });

                seat.classList.add("selected");
                selectedSeat = seat.textContent;
            };

            seatMap.appendChild(seat);
        });
    }
}

/* ============================= */
/* CONTINUAR A PASAJERO */
/* ============================= */

document.getElementById("continuePassenger").onclick = ()=>{

    if(!selectedSeat){
        alert("Selecciona un asiento.");
        return;
    }

    updateTotal();
    goToScreen("screen4");
};

/* ============================= */
/* ACTUALIZAR TOTAL */
/* ============================= */

function updateTotal(){
    const baggage = parseInt(document.getElementById("extraBaggage").value);
    const total = selectedFlightPrice + baggage;
    document.getElementById("totalPrice").textContent =
        "Total: " + total.toLocaleString() + " COP";
}

document.getElementById("extraBaggage").onchange = updateTotal;

/* ============================= */
/* CONFIRMAR RESERVA */
/* ============================= */

document.getElementById("confirmBtn").onclick = ()=>{

    const name = document.getElementById("passengerName").value;

    if(!name){
        alert("Ingresa el nombre del pasajero.");
        return;
    }

    const bookingCode = "LA" + Math.floor(Math.random()*1000000);

    alert(
        "Reserva confirmada\n\n" +
        "Pasajero: " + name +
        "\nAsiento: " + selectedSeat +
        "\nCódigo: " + bookingCode
    );

    location.reload();
};

</script>

</body>
</html>
