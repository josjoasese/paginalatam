<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATAM Travel System - Módulo 1</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }

body { background:#f5f6f8; overflow:hidden; }

.screen {
  width:100%;
  height:100vh;
  display:none;
  padding:40px;
  position:relative;
}

.screen.active {
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.card {
  background:white;
  padding:40px;
  border-radius:16px;
  box-shadow:0 20px 40px rgba(0,0,0,0.08);
  width:100%;
  max-width:900px;
  position:relative;
}

h1 {
  margin-bottom:30px;
  font-weight:700;
}

.form-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-bottom:20px;
  position:relative;
}

input, select {
  padding:14px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:14px;
  width:100%;
}

button {
  padding:16px;
  border:none;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
}

.btn-primary {
  background:#c3002f;
  color:white;
}

.flight-card {
  padding:20px;
  border:1px solid #eee;
  border-radius:12px;
  margin-bottom:15px;
  cursor:pointer;
  transition:0.2s;
}

.flight-card:hover {
  box-shadow:0 10px 20px rgba(0,0,0,0.1);
}

/* Autocomplete dropdown */
.autocomplete-dropdown {
  position:absolute;
  background:#fff;
  border:1px solid #ddd;
  border-radius:8px;
  max-height:200px;
  overflow-y:auto;
  z-index:1000;
  display:none;
}

.autocomplete-option {
  padding:10px;
  cursor:pointer;
}

.autocomplete-option:hover {
  background:#f2f2f2;
}
</style>
</head>
<body>

<!-- SCREEN 1 SEARCH -->
<div id="searchScreen" class="screen active">
  <div class="card">
    <h1>Buscar vuelo</h1>

    <div class="form-grid">
      <div style="position:relative;">
        <input id="origin" placeholder="Origen (Ciudad o IATA)">
      </div>
      <div style="position:relative;">
        <input id="destination" placeholder="Destino (Ciudad o IATA)">
      </div>
      <input type="date" id="departureDate">
      <input type="date" id="returnDate">
      <select id="passengers">
        <option value="1">1 Pasajero</option>
        <option value="2">2 Pasajeros</option>
        <option value="3">3 Pasajeros</option>
        <option value="4">4 Pasajeros</option>
      </select>
      <select id="classType">
        <option value="economy">Economy</option>
        <option value="premium">Premium Economy</option>
      </select>
    </div>

    <button class="btn-primary" onclick="searchFlights()">Buscar vuelos</button>
  </div>
</div>

<!-- SCREEN 2 RESULTS -->
<div id="resultsScreen" class="screen">
  <div class="card">
    <h1>Selecciona tu vuelo</h1>
    <div id="flightsContainer"></div>
    <button onclick="goBack()">Volver</button>
  </div>
</div>

<script>

/* =========================
   ESTADO CENTRAL
========================= */

const appState = {
  search: {},
  flights: [],
  selectedFlight: null
};

/* =========================
   BASE AMPLIADA AEROPUERTOS
========================= */

const AIRPORTS_DB = [
  {city:"Bogotá", iata:"BOG", country:"Colombia"},
  {city:"Medellín", iata:"MDE", country:"Colombia"},
  {city:"Cali", iata:"CLO", country:"Colombia"},
  {city:"Cartagena", iata:"CTG", country:"Colombia"},
  {city:"Lima", iata:"LIM", country:"Perú"},
  {city:"Santiago", iata:"SCL", country:"Chile"},
  {city:"São Paulo", iata:"GRU", country:"Brasil"},
  {city:"Rio de Janeiro", iata:"GIG", country:"Brasil"},
  {city:"Buenos Aires", iata:"EZE", country:"Argentina"},
  {city:"Quito", iata:"UIO", country:"Ecuador"},
  {city:"Miami", iata:"MIA", country:"Estados Unidos"},
  {city:"Madrid", iata:"MAD", country:"España"}
];

/* =========================
   AUTOCOMPLETE REAL
========================= */

function setupAutocomplete(inputId) {
  const input = document.getElementById(inputId);
  const wrapper = input.parentElement;

  const dropdown = document.createElement("div");
  dropdown.className = "autocomplete-dropdown";
  wrapper.appendChild(dropdown);

  input.addEventListener("input", function () {
    const value = this.value.toLowerCase();
    dropdown.innerHTML = "";

    if (value.length < 1) {
      dropdown.style.display = "none";
      return;
    }

    const matches = AIRPORTS_DB.filter(a =>
      a.city.toLowerCase().includes(value) ||
      a.iata.toLowerCase().includes(value)
    );

    if (matches.length === 0) {
      dropdown.style.display = "none";
      return;
    }

    matches.slice(0,8).forEach(match => {
      const option = document.createElement("div");
      option.className = "autocomplete-option";
      option.innerHTML = `${match.city} (${match.iata}) - ${match.country}`;

      option.onclick = function() {
        input.value = `${match.city} (${match.iata})`;
        dropdown.style.display = "none";
      };

      dropdown.appendChild(option);
    });

    dropdown.style.display = "block";
    dropdown.style.width = input.offsetWidth + "px";
  });

  document.addEventListener("click", function(e){
    if(!wrapper.contains(e.target)){
      dropdown.style.display = "none";
    }
  });
}

setupAutocomplete("origin");
setupAutocomplete("destination");

/* =========================
   GENERADOR DE VUELOS
========================= */

function generateFlights(origin, destination, date, passengers, classType) {
  const basePrice = 250000 + Math.floor(Math.random() * 200000);
  const multiplier = classType === "premium" ? 1.8 : 1;

  let flights = [];

  for(let i=0; i<3; i++) {
    flights.push({
      id: i,
      flightNumber: "LA" + (1000 + Math.floor(Math.random()*9000)),
      departure: date + " 0" + (8+i*3) + ":00",
      arrival: date + " 1" + (1+i*3) + ":30",
      price: Math.floor(basePrice * multiplier * passengers)
    });
  }

  return flights;
}

/* =========================
   SEARCH
========================= */

function searchFlights() {
  const origin = document.getElementById("origin").value;
  const destination = document.getElementById("destination").value;
  const departureDate = document.getElementById("departureDate").value;
  const passengers = parseInt(document.getElementById("passengers").value);
  const classType = document.getElementById("classType").value;

  if(!origin || !destination || !departureDate) {
    alert("Completa todos los campos obligatorios.");
    return;
  }

  appState.search = {origin, destination, departureDate, passengers, classType};
  appState.flights = generateFlights(origin, destination, departureDate, passengers, classType);

  renderFlights();
  goToScreen("resultsScreen");
}

/* =========================
   RENDER
========================= */

function renderFlights() {
  const container = document.getElementById("flightsContainer");
  container.innerHTML = "";

  appState.flights.forEach(flight => {
    const div = document.createElement("div");
    div.className = "flight-card";
    div.innerHTML = `
      <strong>${flight.flightNumber}</strong><br>
      ${flight.departure} → ${flight.arrival}<br>
      Precio total: $${flight.price.toLocaleString("es-CO")} COP
    `;
    div.onclick = () => selectFlight(flight);
    container.appendChild(div);
  });
}

function selectFlight(flight) {
  appState.selectedFlight = flight;
  alert("Vuelo seleccionado: " + flight.flightNumber);
}

/* =========================
   NAVIGATION
========================= */

function goToScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function goBack() {
  goToScreen("searchScreen");
}

</script>

</body>
</html>
