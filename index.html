<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LATAM Travel Assistance</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#f5f8fd;
}

/* HEADER */

.header{
height:70px;
background:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 40px;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.logo{
font-size:22px;
font-weight:800;
color:#2d2d8f;
}

/* HERO */

.hero{
height:500px;
background:url("https://images.unsplash.com/photo-1504198266285-165a4dd67c0c") center/cover;
display:flex;
align-items:center;
justify-content:center;
}

.search-box{
width:1000px;
background:white;
padding:30px;
border-radius:16px;
box-shadow:0 30px 70px rgba(0,0,0,0.25);
}

.grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:15px;
}

label{
font-size:12px;
font-weight:700;
}

input{
padding:10px;
border-radius:8px;
border:1px solid #d8e0ea;
width:100%;
}

button{
cursor:pointer;
}

.search-btn{
grid-column:1/-1;
padding:14px;
background:#2d2d8f;
color:white;
border:none;
border-radius:10px;
font-weight:700;
}

/* AUTOCOMPLETE */

.autocomplete{
position:absolute;
background:white;
border-radius:8px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
max-height:200px;
overflow:auto;
z-index:50;
}

.autocomplete div{
padding:8px;
cursor:pointer;
}

.autocomplete div:hover{
background:#f0f4ff;
}

/* RESULTS */

.results{
padding:60px;
display:none;
}

.flight-card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 10px 25px rgba(0,0,0,0.07);
}

.price{
font-size:22px;
font-weight:800;
color:#2d2d8f;
}

/* FARE */

.fares{
display:none;
padding:60px;
text-align:center;
}

.fare-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
max-width:900px;
margin:auto;
}

.fare{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
cursor:pointer;
}

.fare:hover{
transform:scale(1.04);
}

/* CABIN */

.seats{
display:none;
padding:60px;
text-align:center;
}

.aircraft{
width:330px;
background:white;
margin:auto;
padding:25px;
border-radius:150px 150px 25px 25px;
box-shadow:0 20px 60px rgba(0,0,0,0.15);
max-height:520px;
overflow:auto;
}

.row{
display:flex;
justify-content:center;
}

.seat{
width:30px;
height:30px;
margin:4px;
border-radius:6px;
background:#dfe6f2;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
cursor:pointer;
}

.business{background:#bcd3ff}
.exit{background:#ffe2a8}
.occupied{background:#999;cursor:not-allowed}
.selected{background:#2d2d8f;color:white}

.aisle{width:18px}

/* PASSENGER */

.passenger{
display:none;
padding:60px;
max-width:600px;
margin:auto;
}

.summary{
background:white;
padding:20px;
border-radius:12px;
margin-top:20px;
}

.confirm-btn{
background:#2d2d8f;
color:white;
padding:12px;
border:none;
border-radius:8px;
width:100%;
font-weight:700;
}

</style>
</head>

<body>

<header class="header">
<div class="logo">LATAM</div>
</header>

<section class="hero">

<div class="search-box">

<div class="grid">

<div>
<label>Origen</label>
<input id="origin">
</div>

<div>
<label>Destino</label>
<input id="destination">
</div>

<div>
<label>Fecha ida</label>
<input type="date">
</div>

<div>
<label>Fecha regreso</label>
<input type="date">
</div>

<div>
<label>Pasajeros</label>
<input id="passengers" value="1">
</div>

<button class="search-btn" onclick="searchFlights()">Buscar vuelos</button>

</div>
</div>
</section>

<section class="results" id="results"></section>

<section class="fares" id="fares">

<h2>Selecciona tu tarifa</h2>

<div class="fare-grid">

<div class="fare" onclick="selectFare('Basic',0)">
<h3>Basic</h3>
<p>Equipaje de mano</p>
</div>

<div class="fare" onclick="selectFare('Light',50000)">
<h3>Light</h3>
<p>Equipaje 23kg</p>
</div>

<div class="fare" onclick="selectFare('Plus',100000)">
<h3>Plus</h3>
<p>Equipaje + selección asiento</p>
</div>

<div class="fare" onclick="selectFare('Top',200000)">
<h3>Top</h3>
<p>Premium + cambios</p>
</div>

</div>

</section>

<section class="seats" id="seats">

<h2>Selecciona tu asiento</h2>

<div class="aircraft" id="seatMap"></div>

<br>

<button class="confirm-btn" onclick="goPassenger()">Continuar</button>

</section>

<section class="passenger" id="passenger">

<h2>Datos del pasajero</h2>

<input placeholder="Nombre completo" id="name">

<div class="summary" id="summary"></div>

<br>

<button class="confirm-btn" onclick="generateTicket()">Descargar Boarding Pass</button>

</section>

<script>

let basePrice=0
let farePrice=0
let selectedSeat=""

function randomTime(){
let h=Math.floor(Math.random()*24)
let m=Math.floor(Math.random()*60)
return h.toString().padStart(2,"0")+":"+m.toString().padStart(2,"0")
}

function searchFlights(){

results.style.display="block"
results.innerHTML=""

for(let i=0;i<20;i++){

let price=Math.floor(Math.random()*400000)+200000

let card=document.createElement("div")
card.className="flight-card"

card.innerHTML=`
<div>
${origin.value} → ${destination.value}<br>
${randomTime()}
</div>

<div>
<div class="price">$${price.toLocaleString()}</div>
<button onclick="selectFlight(${price})">Seleccionar</button>
</div>
`

results.appendChild(card)

}

}

function selectFlight(price){

basePrice=price

fares.style.display="block"

}

function selectFare(name,price){

farePrice=price

showSeats()

}

function showSeats(){

seats.style.display="block"

const letters=["A","B","C","D","E","F"]

for(let r=1;r<=30;r++){

let row=document.createElement("div")
row.className="row"

letters.forEach(l=>{

if(l==="D"){
let aisle=document.createElement("div")
aisle.className="aisle"
row.appendChild(aisle)
}

let seat=document.createElement("div")
seat.className="seat"

if(r<=3) seat.classList.add("business")
if(r==10||r==11) seat.classList.add("exit")

seat.textContent=r+l

if(Math.random()<0.2) seat.classList.add("occupied")

seat.onclick=()=>{

if(seat.classList.contains("occupied")) return

document.querySelectorAll(".seat").forEach(s=>s.classList.remove("selected"))

seat.classList.add("selected")

selectedSeat=r+l

}

row.appendChild(seat)

})

seatMap.appendChild(row)

}

}

function goPassenger(){

passenger.style.display="block"

let total=basePrice+farePrice

summary.innerHTML=`
Ruta: ${origin.value} → ${destination.value}<br>
Asiento: ${selectedSeat}<br>
Precio total: $${total.toLocaleString()}
`

}

function generateTicket(){

const { jsPDF } = window.jspdf

let doc=new jsPDF()

doc.text("BOARDING PASS",20,20)
doc.text("Pasajero: "+name.value,20,40)
doc.text("Ruta: "+origin.value+" → "+destination.value,20,50)
doc.text("Asiento: "+selectedSeat,20,60)

doc.save("boardingpass.pdf")

}

</script>

</body>
</html>
